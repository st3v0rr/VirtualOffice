name: CI

on:
  push:
    branches: [main, poc/threejs-r3f]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build, test, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test

      # Playwright's Chromium with its system libraries (the runner has sudo)
      - name: Install Chromium for the smoke test
        run: npx playwright-core install --with-deps chromium

      - name: Smoke test (built server + client, headless Chromium)
        run: npm run smoke
        env:
          SMOKE_BROWSER: '1'

      - name: Upload the smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke-artifacts/
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    env:
      # the Docker Hub repository: repository variable (or secret) DOCKERHUB_IMAGE,
      # else this placeholder
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || secrets.DOCKERHUB_IMAGE || 'st3v0rr/virtualoffice' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: virtualoffice-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test against the running container
        run: |
          docker run -d --name demo -p 2567:2567 virtualoffice-demo:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:2567/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:2567/healthz | grep -q '"ok":true'
          curl -fsS http://localhost:2567/ | grep -q '<div id="root">'
          curl -fsS http://localhost:2567/config.js | grep -q '__VIRTUALOFFICE_CONFIG__'
          # the monitor is off in production
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:2567/colyseus/)" = 404
          # every bundle referenced by index.html loads
          for asset in $(curl -fsS http://localhost:2567/ | grep -o '/assets/[^"]*\.js'); do
            curl -fsS -o /dev/null "http://localhost:2567$asset"
          done
          # Docker Desktop/Engine exposes the Dockerfile HEALTHCHECK through inspect.
          # Fail clearly if the image ever loses its health check.
          test "$(docker inspect -f '{{if .Config.Healthcheck}}configured{{end}}' demo)" = configured
          # GitHub-hosted Docker supports the health status field. Retry long enough for
          # the image's 10s start period and first 30s health-check interval.
          for _ in $(seq 1 40); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' demo)
            [ "$status" = healthy ] && break
            [ "$status" != missing ] || { echo 'container health status is missing'; exit 1; }
            sleep 2
          done
          echo "health: $status"
          test "$status" = healthy

      - name: Container logs
        if: always()
        run: docker logs demo || true

      # push only from the demo branch and main, and only if the Docker Hub secrets exist;
      # without them the push is skipped with a notice instead of failing the run
      - name: Check Docker Hub credentials
        id: hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/poc/threejs-r3f' || github.ref == 'refs/heads/main')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docker Hub::DOCKER_HUB_USERNAME/DOCKER_HUB_TOKEN are not set, the image is not pushed."
          fi

      - name: Log in to Docker Hub
        if: steps.hub.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push latest and the short commit sha
        if: steps.hub.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.hub.outputs.sha }}
          cache-from: type=gha
